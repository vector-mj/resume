<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="20"  y="95"  width="120" height="50" rx="4" fill="#f5f5f5" stroke="#333"/>
  <text x="80"  y="125" text-anchor="middle" fill="#333">USB insert</text>

  <rect x="200" y="95"  width="120" height="50" rx="4" fill="#f5f5f5" stroke="#333"/>
  <text x="260" y="118" text-anchor="middle" fill="#333">udev rule</text>
  <text x="260" y="134" text-anchor="middle" fill="#666" font-size="11">match 13fe:3e00</text>

  <rect x="380" y="95"  width="120" height="50" rx="4" fill="#f5f5f5" stroke="#333"/>
  <text x="440" y="118" text-anchor="middle" fill="#333">usb_action.sh</text>
  <text x="440" y="134" text-anchor="middle" fill="#666" font-size="11">case $PORT</text>

  <rect x="540" y="30"  width="80" height="40" rx="4" fill="#fff" stroke="#333"/>
  <text x="580" y="55"  text-anchor="middle" fill="#333">suspend</text>
  <rect x="540" y="100" width="80" height="40" rx="4" fill="#fff" stroke="#333"/>
  <text x="580" y="125" text-anchor="middle" fill="#333">reboot</text>
  <rect x="540" y="170" width="80" height="40" rx="4" fill="#fff" stroke="#333"/>
  <text x="580" y="195" text-anchor="middle" fill="#333">shutdown</text>

  <path d="M140,120 L195,120" stroke="#333" fill="none" marker-end="url(#arrow)"/>
  <path d="M320,120 L375,120" stroke="#333" fill="none" marker-end="url(#arrow)"/>
  <path d="M500,120 L520,120 L520,50  L535,50"  stroke="#333" fill="none" marker-end="url(#arrow)"/>
  <path d="M500,120 L535,120" stroke="#333" fill="none" marker-end="url(#arrow)"/>
  <path d="M500,120 L520,120 L520,190 L535,190" stroke="#333" fill="none" marker-end="url(#arrow)"/>

  <text x="512" y="44"  text-anchor="end" fill="#666" font-size="11">1-3</text>
  <text x="512" y="114" text-anchor="end" fill="#666" font-size="11">1-6</text>
  <text x="512" y="184" text-anchor="end" fill="#666" font-size="11">1-5</text>
</svg>
