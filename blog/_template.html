<!DOCTYPE html>
<!-- Copy this file to blog/<slug>.html, fill it in, then add an <li> to ../blog.html.
     Every bare tag is already styled — see ../styleguide.html for the component catalog.
     Posts stay flat in blog/ so ../css/blog.css resolves. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post title — MJH</title>

<!-- Point this at the post's own URL. -->
<link rel="canonical" href="https://mjha.ir/blog/slug.html">

<!-- Shown in search results and link previews. Rewrite both per post. -->
<meta name="description" content="One sentence describing the post.">
<meta property="og:title" content="Post title">
<meta property="og:description" content="One sentence describing the post.">
<meta property="og:image" content="https://mjha.ir/images/slug.jpg">
<meta property="og:type" content="article">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="../css/blog.css">
<!-- Applies the saved theme before first paint, so dark mode never flashes white. -->
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>

<!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-lKl7wXhR_NHMuRP9A0LEI.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>

<!-- Microsoft Clarity -->
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "y3v7bkkcpn");
</script>
</head>
<body>
<nav>
  <div class="wrap">
    <span class="brand"><a href="../index.html">MJH</a></span>
    <span class="links">
      <a href="../resume_short.html">Resume</a>
      <a href="../blog.html">Blog</a>
      <a href="../index.html#about">About</a>
      <button class="themetoggle" type="button" data-theme-toggle aria-label="Toggle theme">☾</button>
    </span>
  </div>
</nav>

<div class="wrap">
  <article>
    <span class="date">2026-08-10</span>
    <h1>Post title</h1>

    <!-- <img class="hero" src="../images/slug.svg" alt=""> -->

    <p class="lead">One-sentence hook that says why this post exists.</p>

    <!-- Fills itself from the h2/h3 headings below. Delete if the post is short. -->
    <div class="toc" data-auto><p class="ttl">Contents</p></div>

    <h2>First section</h2>
    <p>Just write paragraphs. No classes needed.</p>

    <!-- Code: name the language and it gets highlighted.
         38 languages built in, incl. bash yaml json dockerfile nginx go rust python sql.
         Add class="nohighlight" to opt a block out. -->
    <div class="code">
      <p class="code-ttl">example.yml</p>
      <pre><code class="language-yaml">replicas: 3</code></pre>
    </div>

    <!-- <div class="series">
      <a href="prev.html"><span class="lbl">Previous</span>Cheatsheet #1: Vim</a>
      <a class="next" href="next.html"><span class="lbl">Next</span>Cheatsheet #3: tmux</a>
    </div> -->

    <a class="back" href="../blog.html">&larr; Back to blog</a>
  </article>
</div>

<!-- ===== Scripts: keep only the ones this post actually needs ===== -->

<!-- Code highlighting. Drop if the post has no code. -->
<script src="../js/highlight.min.js"></script>
<script>hljs.highlightAll();</script>

<!-- Copy buttons, table filter, auto-TOC, heading anchors, theme toggle.
     Safe to keep always: each part no-ops if its markup isn't present. -->
<script src="../js/enhance.js"></script>

<!-- Gallery / zoomable images. Drop if the post has none. -->
<script src="../js/lightbox.js"></script>

<!-- ===== Libraries are NOT vendored — import per post, only where needed =====

  Rule for assets: anything that isn't code lives in its own file and is linked,
  never pasted into the post. Diagrams go in ../diagrams/, media in ../images/.
  Only code belongs inline. See styleguide.html for each one.

  Diagrams (draw.io, read-only, pan + zoom) — 4MB, so only where there IS a diagram:
    <div class="drawio mxgraph"
         data-mxgraph='{"url":"../diagrams/thing.drawio","toolbar":"zoom layers lightbox","edit":null}'></div>
    <script src="https://viewer.diagrams.net/js/viewer-static.min.js"></script>

  Maths (KaTeX):
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js"
            onload="renderMathInElement(document.body)"></script>

  Diagrams (Mermaid) — put the diagram source in <pre class="mermaid">:
    <script type="module">
      import m from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
      m.initialize({startOnLoad:true, theme:'neutral'});
    </script>

  Timing diagrams (WaveDrom) — see the styleguide for the markup.
  3D (three.js) — import as a module and render into <div class="scene">.
  Prefer a self-hosted copy in js/ over a CDN once a library earns its place.
-->
</body>
</html>
